particle_filter:
  ros__parameters:
    # topic names
    scan_topic: "/scan"
    odometry_topic: "/odom"   # 정본 계약(30_SIM_REAL_PARITY §3). 시뮬은 gym launch가 /odom으로 리맵
    laser_frame: "laser"
    tf_lookup_timeout: 0.05
    max_future_stamp: 0.05
    clock_reset_threshold: 1.0
    # range data downsampling
    angle_step: 18          # [Jetson 권장 36] 빔 다운샘플 — 연산 자원 종속이라 공용 기본값 유지 (08-10 차량 실사용 36)
    max_particles: 4000     # [Jetson 권장 7000] GPU 여유 활용 — 개발 PC(rm)는 4000 유지
    squash_factor: 3.2      # likelihood 평탄화 (구 2.2 → 08-10 차량 실사용값)
    # visualization
    viz: 1
    max_viz_particles: 60
    # ray marching method
    range_method: "rm"      # [Jetson 전용 "rmgpu"] GPU ray marching — 개발 PC에서는 반드시 rm
    theta_discretization: 112
    # range data filtering
    max_range: 15
    fine_timing: 0
    publish_odom: 1
    # [차량별 장착 설정] 스캔 배열 180° 반전 (구 'for RPLiDAR' 블록).
    # 360° FOV 라이다(RPLiDAR)를 180° 돌려 장착한 차량만 true로 변경.
    # 270° FOV(urg/Hokuyo)는 반드시 false — 절반-스왑이 ~135° 왜곡이 되어 위치추정 발산 (2026-07-23 실차 사고).
    scan_rotate_180: false
    # sensor model constants — 08-10 차량 실사용값 반영 (P0-3, 구값: 0.01/0.07/0.12/0.75/8.0)
    #
    # z_short = 맵보다 가깝게 찍힌 빔("예상 밖 물체")의 가중. 앞차가 맵상 벽을 가리면
    # 위치가 정확한 파티클이 오히려 벌점을 받아 발산한다. 그걸 중립화하는 항이다.
    #
    # [2026-08-20] 0.15 로 올리는 값이 커밋 없이 워킹트리에 방치돼 있었다 — git 이력에
    # 전혀 없고(HEAD c33a5afc 는 0.1), 실차·오프라인 어느 쪽에서도 검증된 적이 없다.
    # 커밋된 0.1 로 원복한다.
    # 되돌리기 판단 자료: z_short 를 0/0.05/0.1 로 바꿔도 스캔↔맵 우도의 전역 최댓점은
    # 참값 자리에서 움직이지 않는다(car1·car6 정지구간, 빔 121/61/31, 18개 조합 전부 —
    # scripts/pose_likelihood.py 로 재현). 즉 현재 관측된 위치추정 실패는 z_short 로
    # 설명되지 않는다. 이 항을 다시 건드리려면 "앞차 가림" 시나리오 실측이 먼저다.
    # (기존 z_short 실측은 전부 try_1(2025-11-04) 옛 트랙 것이다 — 대회 맵 재측정 미완.)
    z_short: 0.1
    z_max: 0.05
    z_rand: 0.05
    z_hit: 0.8
    sigma_hit: 3.0          # 히트 분산 좁힘 = cleaned 맵 품질 신뢰 ↑
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant. 2 = raycast 후 CPU likelihood (전 방식 공통 동작).
    # [Jetson 권장 3] 3 = fused GPU(raycast+likelihood+reduction 원샷, rmgpu 전용) —
    #   fused 지원 .so(scripts/install_rangelib_orin_sm87.sh) 필요, 미지원이면 기동 시 2로 자동 강등.
    #   08-15 car1 실차 검증: 처리율 +30%, update 3.77 ms (PARAMS.md §particle_filter)
    rangelib_variant: 2
    # [P0-3] 헬스 지표 (/pf/health Float32MultiArray) — 레이아웃: pf_health.py
    # [n_eff_ratio, mean_likelihood, pose_jump_m, drift_scale, drift_yaw_rad]
    # drift_scale≠1 지속 = speed_to_erpm_gain 재보정 신호 (OPERATIONS §3-5)
    publish_health: true
    health_window_m: 5.0
    # [P0-5] pose 점프 게이트 — false=끔(기존 동작). 켜면 물리 불가능 점프 시
    # last-good 유지(연속 max_holds 초과 시 새 추정 수용). 실차 검증 후 기본 전환 검토.
    jump_gate_enable: true
    jump_gate_margin_m: 0.5
    jump_gate_max_holds: 5

    # [PF 개선안 ①, 2026-08-19→08-20 수정] n_eff 게이팅 리샘플링 — n_eff_ratio가
    # 이 값 이상이면 그 스텝 리샘플을 건너뛴다(파티클 위치 유지, 센서모델 평가는
    # 정상 진행). 매 스텝 무조건 리샘플하면 정보가 일시적으로 부족한 구간에서
    # 횡방향 모션노이즈(0.025m/스텝)로는 다양성을 못 따라잡고 파티클이
    # 고갈돼("particle deprivation") 확신에 찬 오수렴이 날 수 있다는 일반적인
    # SIR 필터 리스크에 대한 방어책. 되돌리기: 0.0(또는 음수) — 기존 무조건 리샘플.
    #
    # [원 근거, 철회됨] 처음엔 map0815 s≈21.5~24.6m에 "좌측 벽이 사라지는 지점"이
    # 있고 그게 트랙 최대곡률과 겹쳐서 그 구간 PF가 8회 재발산한다고 봤다(단일
    # 수직 레이캐스트로 좌벽까지 4~8m 측정). **이후 부채꼴(±60°) 레이캐스트로
    # 재검증하니 개방부가 존재하지 않았다** — 접선 추정 오차로 레이가 인접 직선
    # 구간을 따라 나간 아티팩트였다(±15~30°만 틀어도 0.6~1.6m에서 벽이 바로
    # 잡힘). 같은 방법으로 "map0815≠map0819(다른 트랙)"라 판단했던 것도 아티팩트
    # 오염된 폭 프로파일 때문이었고, 부채꼴 폭으로 재정렬하면 두 맵은 상관계수
    # 0.878(2.7σ)로 뚜렷이 정렬되는 **같은 트랙**이었다(2026-08-20, 교차세션 검증).
    #
    # [살아남은 관측] map0819(현재 활성 트랙) 4랩 실주행(run_teleop2lap_0819_2230,
    # raycasting과 무관한 실측)에서 발산 미재현 — 4랩 완주, 점프 최대 0.202m,
    # >0.5m 0회. (이 셋은 연속 pose 차분이라 좌표규약에 무관하다.)
    #
    # ⚠ 정합률(%)은 여기 적지 않는다. 하루 사이 93.5 → 72.1 → 81.9 로 세 번 바뀌었고
    #   셋 다 "틀린 값"이 아니라 서로 다른 것을 잰 값이었다:
    #     93.5 = 맵 상한 (스캔을 참값 pose에 얹었을 때의 최대 적중률. 필터 성적 아님)
    #     72.1 = base_link 규약으로 채점 (laser_x=0.165)
    #     81.9 = laser 규약으로 채점    (laser_x=0.0)
    #   72.1 과 81.9 가 갈리는 이유가 미해결 결함이다 — sensor_model()이
    #   sensor_dist = proposal_dist 로 파티클을 그대로 레이캐스트 원점에 쓰는데
    #   (base_link→laser 전방 0.165m를 안 더한다) publish_tf()는 그 pose를
    #   map→base_link 로 놓고 map→odom을 합성한다. 추정은 laser, 발행은 base_link다.
    #   규약이 확정되기 전에는 어느 수를 적어도 다음 사람이 또 고치게 된다.
    #   측정이 필요하면 도구로 뜨고, 어느 규약으로 쟀는지 반드시 같이 적을 것. 이 주행은 본 파라미터가 코드에 존재하기 전이라(당시
    # 미작성·미커밋) 파라미터 효과가 아니라 순수 미재현. s22~28 구간에 scan
    # 잔차 편향(+0.12~0.27m)·파티클 산포 증가(+64%)라는, raycasting과 무관한
    # 독립 신호 2건이 겹치는 국소 이상이 있으나 폭(개방도)과는 무관함이 확인됨
    # — "벽이 없어서"라는 설명은 기각됐고 원인 미상.
    #
    # [결론] "그 코너가 실제로 결함이 있다"는 구체적 서사는 근거가 무너졌다.
    # 이 파라미터가 남아있는 이유는 특정 코너 때문이 아니라 — 대회에서는 이
    # 지도들과 무관한 새 지도를 받으므로, 특정 지점의 결함 여부보다 "정보가
    # 일시적으로 부족해지는 지점이 어디엔가는 있다"는 일반론에 대한 방어적
    # 하드닝으로 유지한다. [실차 미검증] — 정상 주행 방해 여부 및 인위적 정보
    # 결핍(스캔 특정 각도대 마스킹 재생) 시나리오로 검증 필요, 특정 맵의 특정
    # 코너 재현으로 검증하려 하지 말 것(이번 사례가 그 함정).
    resample_neff_thresh: 0.5

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: "map"
