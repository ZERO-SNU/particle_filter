particle_filter:
  ros__parameters:
    # topic names
    scan_topic: "/scan"
    odometry_topic: "/odom"   # 정본 계약(30_SIM_REAL_PARITY §3). 시뮬은 gym launch가 /odom으로 리맵
    # range data downsampling
    angle_step: 18          # [Jetson 권장 36] 빔 다운샘플 — 연산 자원 종속이라 공용 기본값 유지 (08-10 차량 실사용 36)
    max_particles: 4000     # [Jetson 권장 7000] GPU 여유 활용 — 개발 PC(rm)는 4000 유지
    squash_factor: 3.2      # likelihood 평탄화 (구 2.2 → 08-10 차량 실사용값)
    # visualization
    viz: 1
    max_viz_particles: 60
    # ray marching method
    range_method: "rm"      # [Jetson 전용 "rmgpu"] GPU ray marching — 개발 PC에서는 반드시 rm
    theta_discretization: 112
    # range data filtering
    max_range: 15
    fine_timing: 0
    publish_odom: 1
    # [차량별 장착 설정] 스캔 배열 180° 반전 (구 'for RPLiDAR' 블록).
    # 360° FOV 라이다(RPLiDAR)를 180° 돌려 장착한 차량만 true로 변경.
    # 270° FOV(urg/Hokuyo)는 반드시 false — 절반-스왑이 ~135° 왜곡이 되어 위치추정 발산 (2026-07-23 실차 사고).
    scan_rotate_180: false
    # sensor model constants — 08-10 차량 실사용값 반영 (P0-3, 구값: 0.01/0.07/0.12/0.75/8.0)
    z_short: 0.1
    z_max: 0.05
    z_rand: 0.05
    z_hit: 0.8
    sigma_hit: 3.0          # 히트 분산 좁힘 = cleaned 맵 품질 신뢰 ↑
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant. 2 = raycast 후 CPU likelihood (전 방식 공통 동작).
    # [Jetson 권장 3] 3 = fused GPU(raycast+likelihood+reduction 원샷, rmgpu 전용) —
    #   fused 지원 .so(scripts/install_rangelib_orin_sm87.sh) 필요, 미지원이면 기동 시 2로 자동 강등.
    #   08-15 car1 실차 검증: 처리율 +30%, update 3.77 ms (PARAMS.md §particle_filter)
    rangelib_variant: 2
    # [P0-3] 헬스 지표 (/pf/health Float32MultiArray) — 레이아웃: pf_health.py
    # [n_eff_ratio, mean_likelihood, pose_jump_m, drift_scale, drift_yaw_rad]
    # drift_scale≠1 지속 = speed_to_erpm_gain 재보정 신호 (OPERATIONS §3-5)
    publish_health: true
    health_window_m: 5.0
    # [P0-5] pose 점프 게이트 — false=끔(기존 동작). 켜면 물리 불가능 점프 시
    # last-good 유지(연속 max_holds 초과 시 새 추정 수용). 실차 검증 후 기본 전환 검토.
    jump_gate_enable: true
    jump_gate_margin_m: 0.5
    jump_gate_max_holds: 5

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: "map"
